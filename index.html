<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Ladympala.cc</title>
    <meta
      name="description"
      content="Suivi quotidien d'un cheval : soins, rendez-vous, documents et dépenses. Fonctionne hors ligne."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches the page background so the status bar blends into the app.
         The app has no dark theme yet, so both entries are the light value —
         declared explicitly so a dark-mode browser does not invent its own. -->
    <meta name="theme-color" content="#F5F1EC" />
    <meta name="color-scheme" content="light" />

    <!-- Always needed, and precached — preloading it avoids a flash of the
         fallback font on the first paint. -->
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Poppins sets the dashboard's headings, week strip and day cards, but is
         requested only once Lit has rendered that text, so every cold start
         drew them in the fallback font first. All three weights appear on the
         landing page. -->
    <link
      rel="preload"
      href="/fonts/poppins-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-latin-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-latin-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- The dashboard's LCP: the bundled horse photo. horse-card draws it inside
         its shadow root, and only once the database has answered, so without
         this the request would wait for the scripts and IndexedDB. Aimed at the
         default photo: drop it, or make it conditional, once a photo of the
         user's own can replace it. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      href="/src/assets/lea-ladympala-trop-mignonnes.avif"
    />

    <!-- The icons.svg preload tag is injected by vite/icon-sprite.ts, not
         written here — see the comment on its transformIndexHtml hook. -->

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/icons/icon-192.png"
    />
    <!-- iOS ignores the manifest icons for the home screen. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `default` keeps the web view below the status bar, so the top safe-area
         inset is always 0 on iOS. That is deliberate: only the bottom inset
         (home indicator) is consumed, by the nav bar. Switching this to
         `black-translucent` would require handling the top inset too. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ladympala.cc" />
    <meta name="application-name" content="Ladympala.cc" />

    <link rel="stylesheet" href="./src/styles/main.css" />
    <script type="module" src="/src/app-root.ts"></script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p
        style="
          font-family: system-ui, sans-serif;
          padding: 1.5rem;
          text-align: center;
        "
      >
        Ladympala.cc a besoin de JavaScript pour fonctionner. Activez-le puis
        rechargez la page.
      </p>
    </noscript>
  </body>
</html>
