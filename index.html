<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Lady Gestion</title>
    <meta
      name="description"
      content="Suivi quotidien d'un cheval : soins, rendez-vous, documents et dépenses. Fonctionne hors ligne."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches the page background so the status bar blends into the app.
         The app has no dark theme yet, so both entries are the light value —
         declared explicitly so a dark-mode browser does not invent its own. -->
    <meta name="theme-color" content="#F5F1EC" />
    <meta name="color-scheme" content="light" />

    <!-- Always needed, and precached — preloading it avoids a flash of the
         fallback font on the first paint. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Every screen draws icons from this sprite, and it is precached — so
         fetching it in parallel with the module graph keeps the first paint
         from landing before the glyphs do.

         `%BASE_URL%` and not a bare `/icons.svg`: Vite prefixes `base` onto
         root-absolute URLs here only when it can resolve them inside `public/`,
         and the sprite is emitted by `vite/icon-sprite.ts` instead — so that
         one URL, alone among the tags in this file, was shipping unprefixed and
         404ing on a hosted subpath. A *relative* `./icons.svg` would be worse
         still: this shell is also served as `404.html` from arbitrary deep
         paths, where every relative URL in it resolves against the wrong
         directory. -->
    <link rel="preload" href="%BASE_URL%icons.svg" as="image" type="image/svg+xml" />

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <!-- iOS ignores the manifest icons for the home screen. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- `default` keeps the web view below the status bar, so the top safe-area
         inset is always 0 on iOS. That is deliberate: only the bottom inset
         (home indicator) is consumed, by the nav bar. Switching this to
         `black-translucent` would require handling the top inset too. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lady Gestion" />
    <meta name="application-name" content="Lady Gestion" />

    <link rel="stylesheet" href="./src/styles/main.css" />
    <script type="module" src="/src/app-root.ts"></script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 1.5rem; text-align: center">
        Lady Gestion a besoin de JavaScript pour fonctionner. Activez-le puis rechargez la page.
      </p>
    </noscript>
  </body>
</html>
